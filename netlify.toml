# Netlify — The Escape Door. Owner: F2.
# Next 16 runs through the OpenNext adapter (@netlify/plugin-nextjs), which Netlify installs
# automatically — do NOT add [[plugins]] for it (stack-notes §8.1).
# Secrets (SUPABASE_SERVICE_ROLE_KEY etc.) go in the Netlify UI, never in this file.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  directory = "netlify/functions"

# Supabase Storage public images through the Netlify Image CDN (next/image remotePatterns).
[images]
  remote_images = ["https://.*\\.supabase\\.co/storage/v1/object/public/.*"]

# ---------------------------------------------------------------- security headers (all routes)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# ---------------------------------------------------------------- caching
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mockups/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# ---------------------------------------------------------------- never index
[[headers]]
  for = "/lab/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
